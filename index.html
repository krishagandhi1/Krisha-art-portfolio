    TO ADD A PIECE: copy one <figure> block and change these values.
    - href / data-full : full-size image  -> /images/full/<name>.jpg
    - src              : thumbnail        -> /images/thumbs/<name>.jpg
    - width / height   : the thumbnail's real pixel size, to reserve space and stop layout jank
    - alt              : describe the image, for screen readers and search
    - <h2> / .meta     : title, then year - medium
  -->
